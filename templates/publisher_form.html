{% extends "base.html" %}
{% block content %}
<div class="form-card">
    <h2>Add publisher</h2>
    <form method="POST" novalidate>
        <label for="name">Name</label>
        <input id="name" name="name" type="text" value="{{ publisher.name }}" class="{{ 'invalid' if errors.name }}">
        <span class="error">{{ errors.name }}</span>

        <label for="country">Country (optional)</label>
        <input id="country" name="country" type="text" value="{{ publisher.country }}" class="{{ 'invalid' if errors.country }}">
        <span class="error">{{ errors.country }}</span>

        <div class="form-actions">
            <button type="submit">Add publisher</button>
            <a class="btn ghost-link" href="{{ back }}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
